[build]
  publish = "."
  functions = "netlify/functions"
[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200
[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[build.environment]
  NODE_VERSION = "20"
